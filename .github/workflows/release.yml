name: release

# On a version tag (v1.2.3), builds the platform-independent artefacts with the same script as a local
# release and attaches them to a GitHub Release for that tag:
#   liveness engine jars (liveness-core, liveness-onnx, models, face-match-sdk),
#   MockSync executable jar and zip, MockMDS zip, SHA256SUMS.txt and manifest.json.
# The desktop client zip (Windows JRE, TPM machine keys) and the Android APKs (Flutter, Android SDK)
# are built on a workstation with scripts/release.sh and can be added to the same release by hand.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: build and publish platform-independent artefacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            11
            21
          cache: maven

      # release.sh takes JAVA_HOME (the last version above) as its JDK 21; MockSync builds on JDK 11.
      - name: Build engine, MockSync and MockMDS (tests included)
        env:
          JAVA11_HOME: ${{ env.JAVA_HOME_11_X64 }}
        run: bash scripts/release.sh --only engine,mocksync,mockmds --no-runtime --version "${GITHUB_REF_NAME}"

      - name: Show artefacts
        run: cat dist/SHA256SUMS.txt && cat dist/manifest.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            Platform-independent artefacts built from ${{ github.sha }} by `scripts/release.sh`.
            Install steps: `docs/release/INSTALL.md`. What each file is: `docs/release/README.md`.
            Verify downloads with `sha256sum -c SHA256SUMS.txt`.
          files: |
            dist/*.jar
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/manifest.json
