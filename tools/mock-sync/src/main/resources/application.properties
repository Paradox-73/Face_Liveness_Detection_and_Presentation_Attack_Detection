# MockSync settings. Override any of them on the command line, e.g. --mocksync.center-id=10002
server.port=8443
server.ssl.enabled=true
spring.application.name=mock-sync
spring.main.banner-mode=off
# Packets can be large.
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB
server.tomcat.max-swallow-size=-1

# Directories (relative to the start directory, normally tools/mock-sync).
mocksync.work-dir=work
mocksync.data-dir=data
# Plain HTTP for the Android debug build (adb reverse tcp:8080 tcp:8080); 0 turns it off.
mocksync.http-port=8080
mocksync.center-id=10001
mocksync.primary-lang=eng
mocksync.server-version=1.2.0.2
mocksync.auto-register-machines=true
mocksync.token-validity-seconds=15552000
mocksync.face-auth-processes=login_auth,packet_auth,eod_auth,exception_auth
mocksync.ida-auth-status=true
# Device trust anchors served by getcacertificates (DOMAIN=path). rootcaftm.cer is also served under DEVICE so an
# L1 device's digital ID passes the DEVICE-domain trust check (project plan section 4.15).
mocksync.ca-certificates[0]=DEVICE=../../devices/mock-mds/Biometric Devices/rootca.cer
mocksync.ca-certificates[1]=FTM=../../devices/mock-mds/Biometric Devices/rootcaftm.cer
mocksync.ca-certificates[2]=DEVICE=../../devices/mock-mds/Biometric Devices/rootcaftm.cer

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packages-to-scan=io.mosip.mocksync.web

logging.level.root=WARN
logging.level.io.mosip.mocksync=INFO
logging.level.mocksync.requests=INFO
logging.level.org.springframework.boot.web.embedded.tomcat=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level %logger{0} - %msg%n
