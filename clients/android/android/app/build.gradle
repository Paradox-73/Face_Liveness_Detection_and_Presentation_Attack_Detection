plugins {
    id 'jacoco'
}
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    localProperties.load(new FileInputStream(keystorePropertiesFile))
}

// Release signing: storeFile, storePassword, keyAlias and keyPassword from local.properties or key.properties
// (both git-ignored), else from the environment variables ARC_RELEASE_STORE_FILE, ARC_RELEASE_STORE_PASSWORD,
// ARC_RELEASE_KEY_ALIAS and ARC_RELEASE_KEY_PASSWORD (CI secrets). The keystore itself stays outside the
// repository (scripts/android-release-keystore.sh). With ARC_REQUIRE_RELEASE_SIGNING=1 a release build without a
// keystore fails instead of falling back to the debug key.
def releaseSigning = { String name, String env ->
    def value = localProperties[name] ?: System.getenv(env)
    return value ? value.toString().trim() : null
}
def releaseStoreFile = releaseSigning('storeFile', 'ARC_RELEASE_STORE_FILE')
def requireReleaseSigning = (System.getenv('ARC_REQUIRE_RELEASE_SIGNING') ?: '') == '1'
// Optional applicationId suffix for release builds (ARC_RELEASE_APPLICATION_ID_SUFFIX, for example ".release"), so
// a test device can keep the debug app and its data next to the release app. Empty for real releases.
def releaseApplicationIdSuffix = (System.getenv('ARC_RELEASE_APPLICATION_ID_SUFFIX') ?: '').trim()

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"
apply plugin: 'jacoco'

// Ensure bioSdk DEX conversion runs before asset merge
afterEvaluate {
    ['mergeDebugAssets', 'mergeReleaseAssets'].each { taskName ->
        tasks.findByName(taskName)?.dependsOn(':clientmanager:dexifyBiosdkAars')
    }
}

// ARC_ABIS (comma list, for example "arm64-v8a") limits the CPU types packed into the APK. ONNX Runtime and
// Flutter add about 60 MB of native code per CPU type, so a build for one tablet type is much smaller.
def arcAbis = (System.getenv('ARC_ABIS') ?: '').split(',').collect { it.trim() }.findAll { it }

android {
    namespace 'io.mosip.registration_client'
    lintOptions {
        abortOnError false
        ignoreWarnings true
    }
    compileSdkVersion 34
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
        coreLibraryDesugaringEnabled true
    }

    buildFeatures {
        buildConfig true
    }

    jacoco {
        version = "0.8.12"
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "io.mosip.registration_client"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion 28
        targetSdkVersion flutter.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField("String", "BASE_URL", rootProject.ext.serverBaseURL)
        buildConfigField("String", "HEALTH_CHECK_PATH", rootProject.ext.serverHealthCheckPath)
        buildConfigField("String", "ACTUATOR_INFO_PATH", rootProject.ext.serverActuatorInfoPath)
    }

    signingConfigs {
        release {
            keyAlias = releaseSigning('keyAlias', 'ARC_RELEASE_KEY_ALIAS')
            keyPassword = releaseSigning('keyPassword', 'ARC_RELEASE_KEY_PASSWORD')
            storeFile = releaseStoreFile ? file(releaseStoreFile) : null
            storePassword = releaseSigning('storePassword', 'ARC_RELEASE_STORE_PASSWORD')
        }
    }

    // A release APK that talks plain HTTP to a server on the device itself (adb reverse, demo) gets a network
    // security config allowing cleartext to 127.0.0.1 and localhost only.
    if (rootProject.ext.releaseServerIsLoopbackHttp) {
        sourceSets.release.res.srcDirs += 'src/releaseLoopback/res'
    }

    buildTypes {
        debug {
            testCoverageEnabled = true  // Enable test coverage
            buildConfigField("String", "BASE_URL", rootProject.ext.debugServerBaseURL)
            // ONNX Runtime ships about 30 MB of native code per CPU type; debug builds keep a
            // 64-bit device (arm64-v8a) and the x86_64 emulator only.
            ndk {
                abiFilters(*(arcAbis ?: ['arm64-v8a', 'x86_64']))
            }
        }
        release {
            // Signed with the release keystore when one is configured (see releaseSigning above); otherwise with
            // the debug keys, so `flutter run --release` works, unless ARC_REQUIRE_RELEASE_SIGNING=1.
            buildConfigField("String", "BASE_URL", rootProject.ext.releaseServerBaseURL)
            if (releaseApplicationIdSuffix) {
                applicationIdSuffix releaseApplicationIdSuffix
            }
            lintOptions {
                checkReleaseBuilds false
                abortOnError false
            }
            minifyEnabled false
            shrinkResources false
            signingConfig releaseStoreFile ? signingConfigs.release : signingConfigs.debug
            ndk {
                abiFilters(*(arcAbis ?: ['arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86']))
                // architectures: 'armeabi-v7a', 'arm64-v8a', 'armeabi', 'x86', 'x86_64'
            }
        }
    }
    packagingOptions {
        resources.merges.add("git.properties")
        resources.excludes.add("META-INF/LICENSE*")
        resources.excludes.add("META-INF/NOTICE*")
        resources.excludes.add("META-INF/DEPENDENCIES")
        resources.excludes.add("META-INF/AL2.0")
        resources.excludes.add("META-INF/LGPL2.1")
        resources.excludes.add("META-INF/*.kotlin_module")
        resources.excludes.add("META-INF/maven/**")
        resources.excludes.add("META-INF/versions/**")
        resources.excludes.add("META-INF/proguard/**")
        resources.excludes.add("notice.txt")
        resources.excludes.add("META-INF/spring*")
        resources.excludes.add("META-INF/spring/**")
        resources.excludes.add("META-INF/additional-spring*")
        resources.pickFirsts.add("mozilla/public-suffix-list.txt")
        resources.excludes.add("META-INF/INDEX.LIST")
    }
}
tasks.register("jacocoTestReport", JacocoReport) {
    dependsOn "testDebugUnitTest" // Ensure tests run before generating report

    reports {
        xml.required = true
        html.required = true
    }

    sourceDirectories.setFrom(files(["src/main/java"]))
    classDirectories.setFrom(files([
            fileTree(dir: "${buildDir}/intermediates/javac/debug", includes: ["**/*.class"]),
            fileTree(dir: "${buildDir}/tmp/kotlin-classes/debug", includes: ["**/*.class"])
    ]))
    executionData.setFrom(fileTree(dir: buildDir, includes: ["**/*.exec", "**/*.ec"]))
}
flutter {
    source '../..'
}

gradle.taskGraph.whenReady { graph ->
    boolean release = graph.allTasks.any { it.project == project && it.name == 'packageRelease' }
    if (release && requireReleaseSigning && !releaseStoreFile) {
        throw new GradleException('Release signing is required (ARC_REQUIRE_RELEASE_SIGNING=1) but no keystore is ' +
                'configured: set storeFile, storePassword, keyAlias and keyPassword in android/local.properties ' +
                '(scripts/android-release-keystore.sh) or the ARC_RELEASE_* environment variables.')
    }
    if (release) {
        logger.lifecycle("Release APK: server ${rootProject.ext.releaseServerBaseURL}, " +
                "signed with ${releaseStoreFile ? 'the release keystore' : 'the DEBUG key'}" +
                (releaseApplicationIdSuffix ? ", applicationId suffix ${releaseApplicationIdSuffix}" : ''))
    }
}

// Release APKs store the native libraries compressed (Flutter, ONNX Runtime, SQLCipher: about a third of the
// download for one CPU type); Android extracts them at install time. Debug APKs keep them uncompressed for
// faster installs while developing.
androidComponents {
    onVariants(selector().withBuildType('release')) { variant ->
        variant.packaging.jniLibs.useLegacyPackaging.set(true)
    }
}

