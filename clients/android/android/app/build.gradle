    implementation "com.github.Tgo1014:JP2ForAndroid:${rootProject.ext.jp2ForAndroidVersion}"
    implementation "com.auth0.android:jwtdecode:${rootProject.ext.jwtDecodeVersion}"

    implementation "com.fasterxml.jackson.core:jackson-core:${rootProject.ext.jacksonVersion}"
    implementation "com.fasterxml.jackson.core:jackson-databind:${rootProject.ext.jacksonVersion}"
    implementation "com.fasterxml.jackson.core:jackson-annotations:${rootProject.ext.jacksonVersion}"

    implementation "org.apache.commons:commons-lang3:${rootProject.ext.commonsLang3Version}"
    implementation group: 'org.apache.commons', name: 'commons-collections4', version: "${rootProject.ext.commonsCollections4Version}"
    implementation "commons-codec:commons-codec:${rootProject.ext.commonsCodecVersion}"
    implementation group: 'commons-io', name: 'commons-io', version: "${rootProject.ext.commonsIoVersion}"

    implementation "org.bouncycastle:bcprov-jdk18on:${rootProject.ext.bouncycastleVersion}"
    implementation "org.aspectj:aspectjrt:${rootProject.ext.aspectjrtVersion}"
