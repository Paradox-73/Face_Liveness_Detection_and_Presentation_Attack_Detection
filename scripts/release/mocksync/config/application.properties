# Settings for the packaged MockSync. Spring Boot reads config/application.properties from the start folder
# and it overrides the defaults inside mock-sync.jar. Any setting can also be given on the command line,
# e.g. start-mocksync.bat --mocksync.center-id=10002
#
# Device trust anchors served by getcacertificates: the MockMDS root certificates, copied into certs/.
# rootcaftm.cer is also served under DEVICE so an L1 device's digital ID passes the DEVICE-domain trust check.
mocksync.ca-certificates[0]=DEVICE=certs/rootca.cer
mocksync.ca-certificates[1]=FTM=certs/rootcaftm.cer
mocksync.ca-certificates[2]=DEVICE=certs/rootcaftm.cer
