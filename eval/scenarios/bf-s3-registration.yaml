# Scenario for tools/eval/scenario-runner (format: docs/eval/README.md). Technology regression test,
# not an ISO/IEC 30107-3 evaluation result.
id: bf-s3-registration
title: Genuine S3, shipped registration policy (always active since 2026-09-30; passive first in the legacy suites)
kind: bona_fide
subject: S3
condition: C1
workflow: registration
repeat: 4
config:
  active.challenge_types: BLINK,SMILE
stream:
  main: s3-main
  actions:
    BLINK: s3-blink
    SMILE: s3-smile
expect:
  outcome: accept
notes: The challenge pool is limited to BLINK,SMILE because the licensed S3 footage holds genuine clips of these two actions only (its only head turn, made while looking down, is read as a wrong action, and it holds no look-up; eval/packs/sources.yaml).
