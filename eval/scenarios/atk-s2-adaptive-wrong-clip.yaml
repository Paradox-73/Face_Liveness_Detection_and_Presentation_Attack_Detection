# Scenario for tools/eval/scenario-runner (format: docs/eval/README.md). Technology regression test,
# not an ISO/IEC 30107-3 evaluation result.
id: atk-s2-adaptive-wrong-clip
title: 'S2: replay attacker plays a genuine clip of the wrong action for each prompt'
kind: attack
species: SYN-A9
subject: S2
condition: C1
workflow: registration
repeat: 4
config:
  policy.registration: ALWAYS_ACTIVE
  active.challenge_types: TURN_LEFT,TURN_RIGHT
stream:
  main: s2-main
  actions:
    TURN_LEFT: s2-turn-left
    TURN_RIGHT: s2-turn-right
  on_prompt: mismatch
expect:
  outcome: reject
  layers:
  - challenge
notes: The challenge pool is limited to TURN_LEFT,TURN_RIGHT because the adaptive attacker needs a clip of each prompted action, and the licensed S2 footage holds genuine clips of these two actions only (eval/packs/sources.yaml).
