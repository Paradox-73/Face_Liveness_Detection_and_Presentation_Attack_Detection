# Scenario for tools/eval/scenario-runner (format: docs/eval/README.md). Technology regression test,
# not an ISO/IEC 30107-3 evaluation result.
id: bf-s2-registration
title: Genuine S2, shipped registration policy (always active since 2026-09-30; passive first in the legacy suites)
kind: bona_fide
subject: S2
condition: C1
workflow: registration
repeat: 4
config:
  active.challenge_types: TURN_LEFT,TURN_RIGHT
stream:
  main: s2-main
  actions:
    TURN_LEFT: s2-turn-left
    TURN_RIGHT: s2-turn-right
expect:
  outcome: accept
notes: The challenge pool is limited to TURN_LEFT,TURN_RIGHT because the licensed S2 footage holds genuine clips of these two actions only (no blink, smile or look-up clip; eval/packs/sources.yaml).
