# Scenario for tools/eval/scenario-runner (format: docs/eval/README.md). Technology regression test,
# not an ISO/IEC 30107-3 evaluation result.
id: bf-s3-dim
title: 'Genuine S3 in a dim room, synthetic darkening (T-SCN-L-02: dim, then challenges, then pass)'
kind: bona_fide
subject: S3
condition: C2-synthetic
workflow: registration
repeat: 4
config:
  active.challenge_types: BLINK,SMILE
stream:
  main: s3-dim-main
  actions:
    BLINK: s3-dim-blink
    SMILE: s3-dim-smile
expect:
  outcome: accept
notes: Frames are s3-* scaled to 45% brightness with extra noise; a real dim camera raises gain and gamma instead.
